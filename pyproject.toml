[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-lineage"
version = "0.1.0"
description = "Instrument SQLite queries to build an interactive data lineage graph, from any value back to its raw source file."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sqlite-lineage = "sqlite_lineage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqlite_lineage = ["viewer.html"]
